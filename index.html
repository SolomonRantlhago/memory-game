<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <title>Memory Game MVP</title>
    <link rel="stylesheet" href="./src/index.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <div
      class="modal fade"
      id="startModal"
      tabindex="-1"
      aria-labelledby="startModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header justify-content-center">
            <h5 class="modal-title text-center" id="startModalLabel">
              Memory Game
            </h5>
          </div>
          <div class="modal-body text-center">
            <h3>Create Grid</h3>
            <div class="mb-3">
              <label for="rowValue" class="form-label">Rows:</label>
              <input
                type="number"
                id="rowValue"
                class="form-control"
                min="2"
                max="6"
                placeholder="rows"
              />
            </div>
            <div class="mb-3">
              <label for="columnValue" class="form-label">Columns:</label>
              <input
                type="number"
                id="columnValue"
                class="form-control"
                min="2"
                max="6"
                placeholder="columns"
              />
            </div>
            <button id="start-button" class="btn btn-primary">Start</button>
            <div
              id="error-message"
              class="text-danger mt-3"
              style="display: none"
            ></div>
          </div>
        </div>
      </div>
    </div>

    <div
      class="modal fade"
      id="congratsModal"
      tabindex="-1"
      aria-labelledby="congratsModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header modal-header-center">
            <h5 class="modal-title" id="congratsModalLabel">
              Congratulations!
            </h5>
          </div>
          <div class="modal-body text-center">
            <p id="congrats-message"></p>
            <button id="play-again-button" class="btn btn-primary">
              Play Again
            </button>
            <button id="exit-button" class="btn btn-secondary">Exit</button>
          </div>
        </div>
      </div>
    </div>

    <div
      class="container d-flex flex-column justify-content-center align-items-center"
    >
      <h1 class="custom-heading mt-3">Memory Game</h1>
      <div class="row justify-content-center">
        <div id="timer" class="align-self-center left"></div>
        <div class="col-12 col-sm-10 col-md-8 col-lg-6" id="game-container">
          <div class="row g-3 justify-content-center" id="game-board"></div>
        </div>
      </div>
    </div>
    <script src="dist/bundle.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.min.js"></script>
  </body>
</html>
